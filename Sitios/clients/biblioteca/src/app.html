<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#243248" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Playfair Display: el "Bienvenido" de la puerta -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&display=swap"
    />
    <!-- Puerta de entrada: si ya se entró en esta sesión, se marca antes de pintar para que la
         puerta no llegue a verse (ver Puerta.svelte). Con ?puerta se muestra igual. -->
    <script>
      try {
        if (sessionStorage.getItem("bib-puerta") && !/[?&]puerta(=|&|$)/.test(location.search)) {
          document.documentElement.classList.add("bib-adentro");
        }
      } catch (e) {}
    </script>
    <noscript><style>.bib-puerta { display: none; }</style></noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
